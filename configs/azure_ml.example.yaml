subscription_id: ""
resource_group: ""
workspace_name: ""
compute_name: ""
experiment_name: "agentic-mlops-yolo-training"

authentication:
  credential: default

environment:
  mode: registered
  registered_environment: "azureml:yolo-training-env:1"

job:
  timeout_minutes: 120
  stream_logs: true
  download_outputs: true
  output_name: model_output
  tags:
    system: agentic-mlops
    task: object-detection

data:
  input_mode: ro_mount
  asset_uri: null

# 2-step train+eval PipelineJob settings — used by `--training-runner azure-ml-pipeline`.
pipeline:
  timeout_minutes: 240
  stream_logs: true
  download_outputs: true
  train_output_name: model_output
  eval_output_name: eval_output

# Blob Storage artifact sync — uploads per-step artifacts after each workflow step.
# Requires: pip install -e ".[azure]"
storage:
  enabled: false
  datastore_name: workspaceblobstore  # auto-resolves account/container from workspace
  artifact_prefix: agentic-mlops
  # account_url: https://myaccount.blob.core.windows.net  # explicit override (no MLClient call)
  # container_name: my-artifacts                          # explicit override

# Managed Online Endpoint settings — used by `deploy-model --backend azure_ml`.
serving:
  instance_type: Standard_DS2_v2
  instance_count: 1
  auth_mode: key
  timeout_minutes: 20
  # environment:  # defaults to the `environment:` block above if omitted — only
  #   set this if serving needs different dependencies (e.g. an inference server)
  #   than training does.
  #   mode: registered
  #   registered_environment: "azureml:yolo-serving-env:1"
