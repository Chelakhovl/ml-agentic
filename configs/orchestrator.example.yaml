# Orchestrator workflow configuration.
# Copy to orchestrator.yaml and adjust. workflow_id / resume / runs_dir are
# usually passed as CLI flags instead (they change per invocation), but can
# also be set here.
#
# steps: which pipeline steps to run, in order. Omit to default to the 5
# original MVP steps (dataset_validation, training, evaluation, approval,
# model_registry) — same as `run-mvp`.
steps:
  - dataset_validation
  - training
  - evaluation
  - approval
  - model_registry
  # - data_intake
  # - dataset_structuring
  # - dataset_versioning
  # - training_approval   # H4 gate — sits between dataset_versioning and training
  # - model_decision
  # - deployment

dry_run: true

# ── dataset_validation ─────────────────────────────────────────────────────
# Used directly when dataset_structuring is not in `steps`.
dataset_path: /path/to/my_yolo_dataset
data_yaml_path: /path/to/my_yolo_dataset/data.yaml
fail_on_warnings: false

# ── data_intake / dataset_structuring (optional) ───────────────────────────
# raw_data_path: /path/to/raw_images
# dataset_name: factory_defects
# data_source: camera_batch_1
# classes: [scratch, dent, crack]
# label_format: yolo   # yolo | coco
# split_strategy: random   # random | grouped_by_source

# ── training_approval (H4 gate, optional) ───────────────────────────────────
# interactive_training_approval: true
# training_approval_action: approve_training   # required when interactive_training_approval: false
# training_approver: jane.doe

# ── training ─────────────────────────────────────────────────────────────
training_config_path: configs/training.yaml
# training_runner: local-yolo   # fake (dry_run) | local-yolo | azure-ml

# ── evaluation ───────────────────────────────────────────────────────────
# evaluation_config_path: configs/evaluation.yaml
# evaluation_runner: local-yolo
# promotion_policy_path: configs/promotion_policy.yaml

# ── approval ─────────────────────────────────────────────────────────────
interactive_approval: true
# approval_action: approve_model   # required when interactive_approval: false
# approver: jane.doe

# ── model_registry (optional) ───────────────────────────────────────────────
model_name: yolo-model
registry_backend: local   # local | mlflow | azure_ml
registry_dir: outputs/model_registry

# ── deployment (optional) ───────────────────────────────────────────────────
# deployment_target: staging     # staging | production
# deployment_backend: local      # local | azure_ml
# export_format: onnx            # onnx | pt (backend=local only)
# deployment_dir: outputs/deployments
# production_approval_path: ./runs/<workflow_id>/artifacts/approval/approval_decision.json
# rollback_plan: "Revert traffic to previous release via current.json"
# For deployment_backend=azure_ml: azure_model_name/azure_model_version are only
# needed here if model_registry (with registry_backend=azure_ml) is NOT also in
# `steps` — otherwise they're auto-chained from its output.
# azure_model_name: yolo-model
# azure_model_version: 3

# azure_config_path: configs/azure_ml.yaml   # required for any azure-ml/azure_ml choice above
