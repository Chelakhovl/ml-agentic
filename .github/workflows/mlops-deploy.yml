# MLOps model deployment workflow — triggered by OrchestratorWorkflow on completion.
#
# Prerequisites
# ─────────────
# 1. In your Orchestrator config (configs/orchestrator.yaml), add:
#
#      github_actions:
#        owner: myorg
#        repo: ml-pipeline
#        workflow_file: mlops-deploy.yml
#        ref: main
#
#    Set GITHUB_ACTIONS_TOKEN (PAT with actions:write) as an environment
#    variable or in GithubActionsConfig.token.
#
# Required GitHub repository secrets (Settings → Secrets → Actions)
# ──────────────────────────────────────────────────────────────────
#   AZURE_CLIENT_ID        Service principal application (client) ID.
#                          Used by azure/login and the agentic-mlops Azure ML backend.
#   AZURE_TENANT_ID        Azure Active Directory tenant ID.
#   AZURE_CLIENT_SECRET    Service principal client secret.
#                          Rotate regularly; grant only the minimum RBAC roles needed
#                          (AzureML Data Scientist + Storage Blob Data Contributor).
#   AZURE_SUBSCRIPTION_ID  Azure subscription ID — required by az CLI and MLClient.
#   GITHUB_ACTIONS_TOKEN   Personal Access Token (PAT) with the `actions:write` scope.
#                          Used by GithubActionsClient inside OrchestratorWorkflow to
#                          dispatch this workflow_dispatch event programmatically.
#                          Should be scoped to this repository only.
#
# 2. Copy configs/azure_ml.example.yaml → configs/azure_ml.yaml, fill in your
#    workspace details, and commit it (it has no secrets, only resource names).
#
# What it does
# ────────────
# Runs `agentic-mlops deploy-model` for the registered model that the
# Orchestrator pipeline just promoted.  Defaults to staging; set the
# `target` input to "production" together with a pre-existing approval JSON.
#
# Job sequence
# ────────────
#  validate  →  deploy  →  smoke-test
#
# validate:   installs the package and lints configs/orchestrator.example.yaml
#             to catch broken configs before any cloud resource is touched.
# deploy:     the existing deployment logic (local registry or Azure ML endpoint).
# smoke-test: runs a full fake-mode run-mvp to verify the package still works
#             after deploy (end-to-end, no real cloud calls).
#
# Triggered inputs
# ────────────────
# mlops_workflow_id   Orchestrator run ID (e.g. "wf_001").
# model_name          Registered model name.
# model_version       Registered version number (as string).
# registry_backend    "local" | "mlflow" | "azure_ml".
# target              Deployment target: "staging" (default) or "production".

name: MLOps Deploy

on:
  workflow_dispatch:
    inputs:
      mlops_workflow_id:
        description: "Orchestrator workflow run ID"
        required: true
      model_name:
        description: "Registered model name"
        required: false
        default: "yolo-model"
      model_version:
        description: "Registered model version (empty = latest)"
        required: false
        default: ""
      registry_backend:
        description: "Model registry backend (local | azure_ml)"
        required: false
        default: "local"
      target:
        description: "Deployment target"
        required: false
        default: "staging"
        type: choice
        options:
          - staging
          - production

# OIDC token write is required for azure/login with federated credentials.
# contents:read is the minimum for checkout.
permissions:
  contents: read
  id-token: write

# Prevent two deploys to the same target from running concurrently.
# cancel-in-progress: false ensures a queued deploy waits rather than being
# dropped — critical for production where you never want a deploy silently
# cancelled mid-flight.
concurrency:
  group: deploy-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  # ── Pre-deploy validation ────────────────────────────────────────────────────
  validate:
    name: Validate config and package
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install agentic-mlops
        run: pip install -e ".[dev]" --quiet

      - name: Lint orchestrator config
        run: agentic-mlops lint-config configs/orchestrator.example.yaml

  # ── Deployment ───────────────────────────────────────────────────────────────
  deploy:
    name: Deploy ${{ inputs.model_name }} → ${{ inputs.target }}
    runs-on: ubuntu-latest
    needs: [validate]
    environment: ${{ inputs.target }}   # requires env protection rules for production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install agentic-mlops with Azure extras
        run: pip install -e ".[azure]" --quiet

      # Service-principal login — supports both azure/login action and az CLI.
      - name: Azure login (service principal)
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
            }

      # ── Local registry deployment ────────────────────────────────────────────
      - name: Deploy from local registry (staging)
        if: inputs.registry_backend == 'local' && inputs.target == 'staging'
        run: |
          agentic-mlops deploy-model \
            outputs/model_registry/${{ inputs.model_name }}/versions/${{ inputs.model_version || '1' }}/model/best.pt \
            --model-name "${{ inputs.model_name }}" \
            --target staging \
            --export-format onnx

      # ── Azure ML deployment ──────────────────────────────────────────────────
      - name: Deploy to Azure ML Managed Online Endpoint (staging)
        if: inputs.registry_backend == 'azure_ml' && inputs.target == 'staging'
        run: |
          agentic-mlops deploy-model \
            --model-name "${{ inputs.model_name }}" \
            --backend azure_ml \
            --azure-config configs/azure_ml.yaml \
            --azure-model-name "${{ inputs.model_name }}" \
            ${{ inputs.model_version != '' && format('--azure-model-version {0}', inputs.model_version) || '' }}

      - name: Deploy to Azure ML Managed Online Endpoint (production)
        if: inputs.registry_backend == 'azure_ml' && inputs.target == 'production'
        env:
          ROLLBACK_PLAN: "Revert traffic to previous deployment via Azure portal"
        run: |
          # Production gate: requires a pre-existing approval JSON in the run dir.
          # The Orchestrator writes this to runs/<workflow_id>/artifacts/ when
          # the H6 gate passes.  Adjust the path to match your setup.
          APPROVAL_PATH="runs/${{ inputs.mlops_workflow_id }}/artifacts/approval_decision.json"
          agentic-mlops deploy-model \
            --model-name "${{ inputs.model_name }}" \
            --backend azure_ml \
            --azure-config configs/azure_ml.yaml \
            --azure-model-name "${{ inputs.model_name }}" \
            ${{ inputs.model_version != '' && format('--azure-model-version {0}', inputs.model_version) || '' }} \
            --target production \
            --production-approval "$APPROVAL_PATH" \
            --rollback-plan "$ROLLBACK_PLAN"

      - name: Upload deployment report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-report-${{ inputs.mlops_workflow_id }}
          path: |
            runs/${{ inputs.mlops_workflow_id }}/artifacts/deployment_report.json
            outputs/deployments/**/*.json
          if-no-files-found: ignore

  # ── Post-deploy smoke test ───────────────────────────────────────────────────
  smoke-test:
    name: Post-deploy smoke test
    runs-on: ubuntu-latest
    needs: [deploy]
    if: success()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install agentic-mlops
        run: pip install -e ".[dev]" --quiet

      - name: Run end-to-end fake-mode smoke test
        run: |
          agentic-mlops run-mvp \
            --dataset-path tests/fixtures/sample_dataset \
            --data-yaml tests/fixtures/sample_dataset/data.yaml \
            --training-config configs/training.example.yaml \
            --output-dir /tmp/ci_smoke_${{ github.run_id }} \
            --dry-run --no-interactive --approval-action approve_model

      - name: Upload smoke-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-report-${{ github.run_id }}
          path: /tmp/ci_smoke_${{ github.run_id }}/**/*.json
          if-no-files-found: ignore
