name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # ── Lint & unit tests ────────────────────────────────────────────────────────
  test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dev dependencies
        run: pip install -e ".[dev,vision,web]" --quiet

      - name: Lint
        run: ruff check src tests

      - name: Run unit tests with coverage
        run: pytest tests/unit -v --tb=short --cov=agentic_mlops --cov-report=term-missing:skip-covered --cov-fail-under=80

  # ── End-to-end fake-mode smoke test ─────────────────────────────────────────
  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    needs: [test]
    if: success()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dev dependencies
        run: pip install -e ".[dev]" --quiet

      - name: Create minimal fixture dataset
        run: |
          mkdir -p /tmp/smoke_dataset/{images/{train,val},labels/{train,val}}
          echo "path: /tmp/smoke_dataset" > /tmp/smoke_dataset/data.yaml
          echo "train: images/train" >> /tmp/smoke_dataset/data.yaml
          echo "val: images/val" >> /tmp/smoke_dataset/data.yaml
          echo "nc: 1" >> /tmp/smoke_dataset/data.yaml
          echo "names: [defect]" >> /tmp/smoke_dataset/data.yaml

      - name: Run fake-mode end-to-end smoke test
        if: success()
        run: |
          agentic-mlops run-workflow \
            --workflow-id ci_smoke_${{ github.run_id }} \
            --config configs/orchestrator.example.yaml \
            --runs-dir /tmp/smoke_runs
