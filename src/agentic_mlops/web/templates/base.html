<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}MLOps Dashboard{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #f5f5f7;
      --surface:  #ffffff;
      --border:   #d2d2d7;
      --text:     #1d1d1f;
      --muted:    #6e6e73;
      --accent:   #0071e3;
      --accent-h: #0077ed;
      --green:    #34c759;
      --orange:   #ff9500;
      --red:      #ff3b30;
      --blue:     #007aff;
      --purple:   #af52de;
      --sidebar-w: 220px;
      --radius:   12px;
      --shadow:   0 1px 4px rgba(0,0,0,.07);
    }

    html, body { height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      font-size: 14px;
      color: var(--text);
      background: var(--bg);
      display: flex;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: var(--sidebar-w);
      min-height: 100vh;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0; left: 0; bottom: 0;
    }
    .sidebar-logo {
      padding: 24px 20px 16px;
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -.3px;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sidebar-logo-icon {
      width: 28px; height: 28px;
      background: var(--accent);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 15px;
    }
    .sidebar-nav { padding: 8px 12px; flex: 1; }
    .sidebar-nav a {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 8px;
      color: var(--muted);
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 500;
      transition: background .15s, color .15s;
      margin-bottom: 2px;
    }
    .sidebar-nav a:hover { background: var(--bg); color: var(--text); }
    .sidebar-nav a.active { background: #e8f0fb; color: var(--accent); }
    .sidebar-nav .nav-icon { font-size: 15px; width: 18px; text-align: center; }
    .sidebar-footer {
      padding: 16px 20px;
      font-size: 11px;
      color: var(--muted);
      border-top: 1px solid var(--border);
    }

    /* ── Main ── */
    .main {
      margin-left: var(--sidebar-w);
      flex: 1;
      min-height: 100vh;
      padding: 32px 40px;
    }
    .page-header {
      margin-bottom: 24px;
    }
    .page-header h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -.4px;
    }
    .page-header p {
      color: var(--muted);
      margin-top: 4px;
      font-size: 13px;
    }

    /* ── Cards ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px 24px;
      margin-bottom: 20px;
    }
    .card-title {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .4px;
      color: var(--muted);
      margin-bottom: 14px;
    }

    /* ── Stat cards ── */
    .stat-row {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px 20px;
    }
    .stat-card .stat-label {
      font-size: 11.5px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .stat-card .stat-value {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -.5px;
      color: var(--text);
    }
    .stat-card.green .stat-value  { color: var(--green); }
    .stat-card.orange .stat-value { color: var(--orange); }
    .stat-card.red .stat-value    { color: var(--red); }
    .stat-card.blue .stat-value   { color: var(--blue); }

    /* ── Badges ── */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 9px;
      border-radius: 20px;
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: .2px;
      white-space: nowrap;
    }
    .badge-completed  { background: #d4f5de; color: #1a7a32; }
    .badge-running    { background: #fff3d4; color: #9a6000; }
    .badge-pending    { background: #fff0d4; color: #984c00; }
    .badge-failed     { background: #fde8e7; color: #9b2219; }
    .badge-blocked    { background: #fde8e7; color: #9b2219; }
    .badge-skipped    { background: #f0f0f5; color: #6e6e73; }
    .badge-default    { background: #f0f0f5; color: #6e6e73; }

    /* ── Tables ── */
    .table-wrap { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.5px;
    }
    th {
      text-align: left;
      font-size: 11.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .4px;
      color: var(--muted);
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    td {
      padding: 11px 14px;
      border-bottom: 1px solid #f0f0f2;
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fafafa; }
    .table-link {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }
    .table-link:hover { text-decoration: underline; }
    .muted { color: var(--muted); }
    .mono  { font-family: "SF Mono", "Fira Code", monospace; font-size: 12px; }

    /* ── Forms ── */
    .form-group { margin-bottom: 18px; }
    label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }
    label .hint { font-weight: 400; color: var(--muted); }
    input[type=text], input[type=number], select, textarea {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13.5px;
      font-family: inherit;
      color: var(--text);
      background: var(--surface);
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    input[type=text]:focus, input[type=number]:focus, select:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0,113,227,.12);
    }
    textarea { min-height: 80px; resize: vertical; }
    .checkboxes { display: flex; flex-wrap: wrap; gap: 8px 14px; }
    .checkboxes label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 400;
      font-size: 13px;
      margin-bottom: 0;
      cursor: pointer;
    }
    .checkboxes input[type=checkbox] { width: auto; }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 18px;
      border: none;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s, opacity .15s;
      text-decoration: none;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-h); }
    .btn-secondary {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: #e8e8ec; }
    .btn-danger { background: var(--red); color: #fff; }
    .btn-sm { padding: 6px 12px; font-size: 12.5px; }

    /* ── Alert / Banner ── */
    .alert {
      border-radius: var(--radius);
      padding: 14px 18px;
      margin-bottom: 20px;
      font-size: 13.5px;
    }
    .alert-info    { background: #e8f0fb; border: 1px solid #bfd3f5; color: #004088; }
    .alert-success { background: #d4f5de; border: 1px solid #a8ddb5; color: #1a6a2e; }
    .alert-warning { background: #fff3d4; border: 1px solid #fcd88a; color: #7a4900; }
    .alert-error   { background: #fde8e7; border: 1px solid #f5b5b2; color: #8a1a15; }
    .alert strong { font-weight: 700; }

    /* ── Code block ── */
    pre.cli {
      background: #1d1d1f;
      color: #f5f5f7;
      border-radius: 10px;
      padding: 16px 18px;
      font-family: "SF Mono", "Fira Code", "Consolas", monospace;
      font-size: 12.5px;
      line-height: 1.7;
      overflow-x: auto;
      margin: 12px 0;
    }
    .copy-btn {
      float: right;
      background: rgba(255,255,255,.12);
      border: none;
      color: #ccc;
      border-radius: 5px;
      padding: 3px 9px;
      font-size: 11px;
      cursor: pointer;
      margin-left: 8px;
    }
    .copy-btn:hover { background: rgba(255,255,255,.22); color: #fff; }

    /* ── Timeline (audit log) ── */
    .timeline { list-style: none; }
    .timeline li {
      display: flex;
      gap: 12px;
      padding: 9px 0;
      border-bottom: 1px solid #f0f0f2;
      align-items: flex-start;
    }
    .timeline li:last-child { border-bottom: none; }
    .timeline-icon {
      width: 24px; height: 24px;
      border-radius: 50%;
      background: var(--bg);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .timeline-icon.ok   { background: #d4f5de; border-color: #a8ddb5; }
    .timeline-icon.err  { background: #fde8e7; border-color: #f5b5b2; }
    .timeline-icon.info { background: #e8f0fb; border-color: #bfccee; }
    .timeline-body { flex: 1; }
    .timeline-event { font-weight: 600; font-size: 13px; }
    .timeline-meta  { color: var(--muted); font-size: 11.5px; margin-top: 2px; }

    /* ── Steps table inside detail ── */
    .step-name { display: flex; align-items: center; gap: 7px; font-weight: 500; }

    /* ── Misc ── */
    .divider { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
    .text-muted { color: var(--muted); }
    .mt-2 { margin-top: 8px; }
    .mb-2 { margin-bottom: 8px; }
    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: var(--muted);
    }
    .empty-state .empty-icon { font-size: 36px; margin-bottom: 12px; }
    .empty-state p { font-size: 14px; }
    .empty-state a { color: var(--accent); }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 860px) { .two-col { grid-template-columns: 1fr; } }

    /* ── Toggle switch ── */
    .toggle-group { display: flex; align-items: center; gap: 10px; }
    .toggle { position: relative; width: 36px; height: 20px; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-slider {
      position: absolute; cursor: pointer;
      inset: 0;
      background: #d2d2d7;
      border-radius: 20px;
      transition: .2s;
    }
    .toggle-slider::before {
      content: "";
      position: absolute;
      width: 16px; height: 16px;
      left: 2px; bottom: 2px;
      background: #fff;
      border-radius: 50%;
      transition: .2s;
    }
    .toggle input:checked + .toggle-slider { background: var(--accent); }
    .toggle input:checked + .toggle-slider::before { transform: translateX(16px); }
  </style>
</head>
<body>
  <nav class="sidebar">
    <a href="/" class="sidebar-logo">
      <span class="sidebar-logo-icon">⚙</span>
      MLOps
    </a>
    <div class="sidebar-nav">
      <a href="/" class="{{ 'active' if request.url.path == '/' else '' }}">
        <span class="nav-icon">◈</span> Dashboard
      </a>
      <a href="/workflows/new" class="{{ 'active' if request.url.path == '/workflows/new' else '' }}">
        <span class="nav-icon">＋</span> New Run
      </a>
      <a href="/registry" class="{{ 'active' if request.url.path.startswith('/registry') else '' }}">
        <span class="nav-icon">📦</span> Registry
      </a>
      <a href="/datasets" class="{{ 'active' if request.url.path.startswith('/datasets') else '' }}">
        <span class="nav-icon">🗂</span> Datasets
      </a>
      <a href="/monitoring" class="{{ 'active' if request.url.path == '/monitoring' else '' }}">
        <span class="nav-icon">📊</span> Monitoring
      </a>
    </div>
    <div class="sidebar-footer">agentic-mlops</div>
  </nav>

  <main class="main">
    {% if flash %}
    <div class="alert alert-success">{{ flash | replace('+', ' ') | replace('%27', "'") }}</div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>

  <script>
    // Copy button helper
    document.addEventListener('click', (e) => {
      if (e.target.classList.contains('copy-btn')) {
        const pre = e.target.closest('pre');
        const text = pre ? pre.innerText.replace('Copy', '').trim() : '';
        navigator.clipboard?.writeText(text).then(() => {
          e.target.textContent = 'Copied!';
          setTimeout(() => e.target.textContent = 'Copy', 1500);
        });
      }
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
