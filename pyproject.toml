[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-mlops-yolo"
version = "0.1.0"
description = "Agentic MLOps workflow for YOLO object detection"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Leonid Chelakhov" }]
keywords = ["mlops", "yolo", "object-detection", "agents", "azure-ml", "mlflow"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.scripts]
agentic-mlops = "agentic_mlops.cli.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4.0",
]
mlflow = [
    "mlflow>=2.0",
]
azure = [
    "azure-ai-ml>=1.12",
    "azure-identity>=1.15",
    "azure-storage-blob>=12.20.0",
    "azure-monitor-query>=1.2.0",
]
vision = [
    "Pillow>=10.0",
]
web = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
filterwarnings = [
    # Azure ML SDK uses marshmallow internals that emit version-migration
    # warnings on every import — not actionable, so suppress them globally.
    "ignore::marshmallow.warnings.RemovedInMarshmallow4Warning",
    "ignore::marshmallow.warnings.ChangedInMarshmallow4Warning",
]
markers = [
    "azure_integration: requires a real Azure ML workspace + credentials (az login or service principal env vars). Opt-in only -- automatically skipped unless --azure-config is passed. Run with: pytest tests/integration -m azure_integration --azure-config configs/azure_ml.yaml",
    "slow: marks tests that take significantly longer than average (deselect with -m 'not slow')",
]
