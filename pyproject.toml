[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-mlops-yolo"
version = "0.1.0"
description = "Agentic MLOps workflow for YOLO object detection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.scripts]
agentic-mlops = "agentic_mlops.cli.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4.0",
]
mlflow = [
    "mlflow>=2.0",
]
azure = [
    "azure-ai-ml>=1.12",
    "azure-identity>=1.15",
]
vision = [
    "Pillow>=10.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
markers = [
    "azure_integration: requires a real Azure ML workspace + credentials (az login or service principal env vars). Opt-in only -- automatically skipped unless --azure-config is passed. Run with: pytest tests/integration -m azure_integration --azure-config configs/azure_ml.yaml",
]
